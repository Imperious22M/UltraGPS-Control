name: Release

# Cut a versioned GitHub Release with the .deb package attached.
#
# Triggers:
#   - Pushing a version tag (e.g. v1.0) — conventionally on the `release`
#     branch, which is the stable snapshot of a released version.
#   - Running the workflow manually (Actions tab → Release → Run workflow).
#     The tag is derived from the VERSION file (1.0 -> v1.0) and created on
#     the commit the workflow runs on.
#
# Release procedure (tag push):
#   1. Make sure `release` is at the exact commit you want to ship, and that the
#      VERSION file matches the version you are tagging.
#   2. Tag it and push the tag:
#          git checkout release
#          git tag v1.0
#          git push origin v1.0
#   3. This workflow builds the .deb and publishes it under the Releases tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# gh release create needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper \
            dh-python \
            pybuild-plugin-pyproject \
            python3-all \
            python3-setuptools \
            build-essential

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine the tag and verify it matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual release: the tag is derived from the VERSION file.
            tag="v$version"
            echo "Manual release: using tag $tag from VERSION file ($version)"
          else
            # Tag push: the tag comes from the Git ref.
            tag="$GITHUB_REF_NAME"
            echo "Tag push: using tag $tag from Git ref, VERSION file is $version"
          fi

          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag ($tag) does not match the VERSION file (v$version). Update VERSION to match the tag before releasing."
            exit 1
          fi

          # VERSION = bare version for the .deb filename (1.0)
          # TAG     = git tag / release name (v1.0)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build the .deb package
        run: bash build.sh deb

      - name: Create the GitHub Release and upload the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "build/ultragps-control_${VERSION}_all.deb" \
            --target "$GITHUB_SHA" \
            --title "UltraGPS Control $TAG" \
            --generate-notes
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ultragps-position"
version = "1.0.0"
description = "Standalone 2D-position computation library for the UltraGPS system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]

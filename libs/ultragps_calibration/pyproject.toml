[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ultragps-calibration"
version = "1.0.0"
description = "Standalone two-point histogram calibration library for the UltraGPS system"
requires-python = ">=3.11"
dependencies = [
    "ultragps-client",
]

[tool.setuptools.packages.find]
where = ["."]

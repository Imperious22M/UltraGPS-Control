site_name: UltraGPS Control
site_description: >-
  Documentation for the St. Mary's University UltraGPS control program.
# Project-page URL on GitHub Pages: https://<user>.github.io/<repo>/
site_url: https://imperious22m.github.io/UltraGPS-Control/

repo_url: https://github.com/Imperious22M/UltraGPS-Control
repo_name: Imperious22M/UltraGPS-Control

# Built-in theme — no extra pip packages required.
theme:
  name: readthedocs

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Developer's Guide: developer-guide.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true

# requirements.txt lives in docs/ for convenience but is a build input, not a
# page.
exclude_docs: |
  requirements.txt

# Fail the build on broken internal links / missing nav pages
strict: true
